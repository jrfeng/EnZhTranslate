name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ''
            paths: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            name: macos
            args: --target universal-apple-darwin
            paths: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            name: linux
            args: ''
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross targets
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('EnZhTranslate {0}', github.ref_name) || '' }}
          releaseBody: |
            各平台产物见下方 assets。

            - Windows：`EnZhTranslate_*_x64-setup.exe`（NSIS 安装包）
            - macOS：`EnZhTranslate_*_universal.dmg`（Intel + Apple Silicon）
            - Linux：`EnZhTranslate_*_amd64.deb`、`EnZhTranslate_*_amd64.AppImage`

            产物未签名：Windows 首次运行需在 SmartScreen 里选「更多信息 → 仍要运行」；
            macOS 首次打开需右键「打开」，或执行 `xattr -dr com.apple.quarantine`。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: en-zh-translate-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
