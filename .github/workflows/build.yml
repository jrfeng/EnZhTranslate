name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ''
            paths: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-13
            name: macos
            # 个人账号的私有仓库用不了 macos-14（arm64）托管 runner，
            # 会报 The configuration 'macos-14-arm64-us-xl' is not supported；
            # 改用 Intel 的 macos-13，再交叉编译到 Apple Silicon。
            args: '--target aarch64-apple-darwin'
            paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          # Linux 构建暂时关闭（目前不需要）。
          # 需要时把下面这段取消注释，并恢复「Install Linux dependencies」步骤即可。
          # - platform: ubuntu-22.04
          #   name: linux
          #   args: ''
          #   paths: |
          #     src-tauri/target/release/bundle/deb/*.deb
          #     src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 交叉编译到 arm64 需要显式安装目标
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin' || '' }}

      # Linux 构建依赖（随 Linux job 一起关闭）
      # - name: Install Linux dependencies
      #   if: matrix.name == 'linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       libwebkit2gtk-4.1-dev \
      #       libayatana-appindicator3-dev \
      #       librsvg2-dev \
      #       libssl-dev \
      #       libfuse2 \
      #       patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Fish翻译 {0}', github.ref_name) || '' }}
          releaseBody: |
            各平台产物见下方 assets。

            - Windows：`Fish翻译_*_x64-setup.exe`（NSIS 安装包）
            - macOS：`Fish翻译_*_aarch64.dmg`（Apple Silicon 原生）

            产物未签名：Windows 首次运行需在 SmartScreen 里选「更多信息 → 仍要运行」；
            macOS 首次打开需右键「打开」，或执行 `xattr -dr com.apple.quarantine`。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: fish-translate-${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
