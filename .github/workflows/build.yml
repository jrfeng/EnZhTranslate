name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ''
            # 安装包落在 NSIS 目录
            bundles: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            name: macos
            args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            name: linux
            args: ''
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross targets
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Linux 构建依赖
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 自己构建而不是用 tauri-action 的自动上传，因为产物名要改成 ASCII
      - name: Build
        shell: bash
        run: npx tauri build ${{ matrix.args }}

      # GitHub 的 Release 会把资源名里的中文抹掉（Fish翻译_0.7.1 会变成 Fish._0.7.1），
      # 所以这里把产物复制成 ASCII 名字再上传；安装后的应用名仍然是中文（由 productName 决定）。
      - name: Rename artifacts to ASCII
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          files=(${{ matrix.bundles }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有找到构建产物" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            base=$(basename "$f")
            new=$(printf '%s' "$base" | sed 's/^Fish[^_]*_/FishTranslate_/')
            echo "$base -> $new"
            cp "$f" "out/$new"
          done
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          merge-multiple: true
          path: out

      - name: List assets
        run: ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Fish翻译 ${{ github.ref_name }}
          body: |
            各平台产物见下方 assets（文件名用英文，安装后显示「Fish翻译」）。

            - Windows：`FishTranslate_*_x64-setup.exe`（NSIS 安装包）
            - macOS：`FishTranslate_*_universal.dmg`（Intel + Apple Silicon 通用）

            产物未签名：Windows 首次运行需在 SmartScreen 里选「更多信息 → 仍要运行」；
            macOS 首次打开需右键「打开」，或执行 `xattr -dr com.apple.quarantine`。
          files: out/*
